title: "nf/dkfz_rnaseq Analysis Report"
subtitle: "RNA-Seq Pipeline Quality Control"

report_comment: >
  This report has been generated by the <a href="https://github.com/nf/dkfz_rnaseq/tree/dev" target="_blank">nf/dkfz_rnaseq</a>
  analysis pipeline.

report_section_order:
  "nf-dkfz_rnaseq-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-dkfz_rnaseq-summary":
    order: -1002
  star:
    order: -990
  rsem:
    order: -980
  salmon:
    order: -970
  kallisto:
    order: -960
  featureCounts:
    order: -950
  arriba:
    order: -940
  rustqc:
    order: -920

module_order:
  - fastqc
  - star
  - rsem
  - salmon
  - kallisto
  - featureCounts
  - arriba
  - qualimap
  - rnaseqc
  - samtools
  - rustqc

# Customizing the General Stats table for multi-quantifier comparison
table_columns_visible:
  star:
    uniquely_mapped_percent: true
    multimapped_percent: false
  salmon:
    percent_mapped: true
  kallisto:
    percent_mapped: true
  featureCounts:
    percent_assigned: true

# Plot settings
export_plots: true
disable_version_detection: true

# Performance tweaks for large runs
max_table_rows: 10000