repository_type: pipeline

nf_core_version: 3.5.1

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-dkfz_rnaseq_logo_light.png
    - docs/images/nf-core-dkfz_rnaseq_logo_light.png
    - docs/images/nf-core-dkfz_rnaseq_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .prettierignore
    - .prettierignore
    - .prettierignore
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-dkfz_rnaseq_logo_light.png
    - docs/images/nf-core-dkfz_rnaseq_logo_light.png
    - docs/images/nf-core-dkfz_rnaseq_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt

template:
  org: nf
  name: dkfz_rnaseq
  description: RNA seq data analysisnextflow  pipeline originated from roddy version
    developed in DKFZ
  author: kubranarci
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - gpu
    - email
    - adaptivecard
    - slackreport
  is_nfcore: false
